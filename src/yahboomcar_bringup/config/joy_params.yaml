yahboom_joy:
  ros__parameters:
    # Hard safety ceilings (m/s, rad/s). Gear list values above these get clamped.
    xspeed_limit: 1.5
    yspeed_limit: 1.5
    angular_speed_limit: 2.0

    # Gear values cycled by the stick-click buttons. Units: m/s for linear, rad/s for angular.
    # Full stick deflection at gear N yields exactly gear[N] m/s or rad/s (before the ceiling clamp).
    linear_gears: [1.0, 1.5, 0.5]
    angular_gears: [2.0, 0.6, 1.0]
