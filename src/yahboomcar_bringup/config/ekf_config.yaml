ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false
    publish_tf: true
    publish_acceleration: false
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    map_frame: map
    # Wheels: x/y translation only. Mecanum yaw comes from roller slip, so
    # heading (yaw + vyaw) is deliberately NOT fused from wheel odom.
    odom0: odom_raw
    odom0_config: [true,  true,  false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 20
    odom0_differential: false
    odom0_relative: false
    # Base-board gyro owns heading: fuse yaw RATE only (raw IMU, no
    # orientation estimate onboard — identity quaternion, so never fuse yaw
    # itself). Mounting rotation is handled via the base_link->imu_link TF.
    imu0: imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 50
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
