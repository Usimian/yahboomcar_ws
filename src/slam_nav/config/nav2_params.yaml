controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0  # Good performance with DWB
    min_x_velocity_threshold: 0.1      # Match robot's physical minimum
    min_y_velocity_threshold: 0.1      # Updated: sideways minimum 0.1 m/s
    min_theta_velocity_threshold: 0.5   # Updated: rotation minimum 0.5 rad/s
    failure_tolerance: 3.0  # Increased patience for navigation to tight spaces
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    current_goal_checker: "general_goal_checker"  # FIXED: Added missing parameter
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    
    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.08        # meters
      yaw_goal_tolerance: 0.1       # radians

    # DWB Controller - Reliable and lightweight for Jetson Orin Nano
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0              # Allow stopping, no reverse movement
      min_vel_y: 0.0              # Allow stopping and sideways in both directions
      max_vel_x: 0.15             # Max forward/backward speed: 0.15 m/s
      max_vel_y: 0.15             # Max sideways speed: 0.15 m/s
      max_vel_theta: 0.8          # Max rotational speed: 0.8 rad/s
      min_speed_xy: 0.0            # Allow stopping (consistent with min_vel settings)
      max_speed_xy: 0.15          # Max combined XY speed: 0.15 m/s
      min_speed_theta: 0.0         # Allow stopping rotation (consistent with forward-only setup)
      # Acceleration limits
      acc_lim_x: 2.5
      acc_lim_y: 2.5               # Enable sideways acceleration for sideways movement
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: -2.5            # Enable sideways deceleration
      decel_lim_theta: -3.2
      # Trajectory generation
      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 15
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 2.0
      xy_goal_tolerance: 0.08       # meters - match goal checker tolerance
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      # Critics for path following
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.015    # Reduced from 0.02 to be less obstacle-avoidant
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0    # Balanced frequency
      publish_frequency: 2.0   # Reasonable for real-time
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 4              # Larger for better local planning
      height: 4             # Larger for better local planning  
      resolution: 0.025     # Optimized for Jetson processing5     # Slightly larger for Jetson efficiency
      footprint: "[[0.12, 0.11], [0.12, -0.11], [-0.12, -0.11], [-0.12, 0.11]]"  # 240mm long x 220mm wide robot
      transform_tolerance: 3.0  # Increased for SLAM synchronization
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0  # Reduced from 3.0 for less aggressive cost scaling
        inflation_radius: 0.18   # Reduced from 0.25 to allow closer approach
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan camera
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.05001
          obstacle_max_range: 2.2     # Reduced from 2.5 to be less conservative about distant obstacles
          obstacle_min_range: 0.05001
        camera:
          topic: /camera/depth/points
          max_obstacle_height: 1.5
          min_obstacle_height: 0.05
          clearing: True
          marking: True
          data_type: "PointCloud2"
          expected_update_rate: 10.0
          observation_persistence: 0.0
          inf_is_valid: False
          filter_size: 1
          filter_by_distance: True
          min_d: 0.2
          max_d: 2.0
          point_cloud_min_z: -0.3
          point_cloud_max_z: 1.5
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

local_costmap_client:
  ros__parameters:
    use_sim_time: False

local_costmap_rclcpp_node:
  ros__parameters:
    use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0   # Conservative for stability  
      publish_frequency: 1.0  # Standard global planning rate
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      footprint: "[[0.12, 0.11], [0.12, -0.11], [-0.12, -0.11], [-0.12, 0.11]]"  # 240mm long x 220mm wide robot
      resolution: 0.025          # Slightly coarser resolution for easier planning in tight spaces
      track_unknown_space: true
      transform_tolerance: 3.0  # Increased for SLAM synchronization
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan camera
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.05001
          obstacle_max_range: 2.2     # Reduced from 2.5 to be less conservative about distant obstacles
          obstacle_min_range: 0.05001
        camera:
          topic: /camera/depth/points
          max_obstacle_height: 1.5
          min_obstacle_height: 0.05
          clearing: True
          marking: True
          data_type: "PointCloud2"
          expected_update_rate: 10.0
          observation_persistence: 0.0
          inf_is_valid: False
          filter_size: 1
          filter_by_distance: True
          min_d: 0.2
          max_d: 3.0
          point_cloud_min_z: -0.3
          point_cloud_max_z: 1.5
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0  # Reduced from 3.0 for less aggressive cost scaling
        inflation_radius: 0.18   # Reduced from 0.25 to allow closer approach
      always_send_full_costmap: True

