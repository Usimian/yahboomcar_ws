# Robot Jetson Data Server Configuration
# Configuration for the robot-side data server running on Jetson
# Sends sensor data to PC client hub (which runs VILA) and receives commands back
# Part of slam_nav package

robot_jetson_server:
  ros__parameters:
    # Client Hub Connection (PC running VILA)
    client_hub_url: "http://192.168.1.153:5000"  # PC client IP address
    
    # Robot Identification
    robot_id: "yahboomcar_x3_01"  # Unique robot ID - change for multiple robots
    
    # Data Transmission Settings
    send_frequency: 2.0  # Hz - how often to send data to hub (recommend 1-3 Hz)
    
    # Image Settings
    image_quality: 85  # JPEG quality (1-100) - lower for less bandwidth
    
    # Movement Parameters
    linear_velocity: 0.2   # m/s - forward/backward speed
    angular_velocity: 0.3  # rad/s - turning speed
    
    # Safety Settings
    emergency_stop_enabled: true
    max_no_response_time: 10.0  # seconds before emergency stop
    
    # Network Settings
    request_timeout: 10.0  # seconds for HTTP requests
    connection_retry_interval: 5.0  # seconds between connection attempts